[package]
name = "game-player"
version = "0.1.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = ["custom-protocol"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
percent-encoding = "2.3.2"
mime_guess = "2.0.5"
sha2 = "0.10.9"
tempfile = "3.27.0"

[profile.release]
strip = true
