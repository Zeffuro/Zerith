[package]
name = "opener-dbus-tests"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
async-io = "2"
futures-lite = "2"
libc = "0.2"
thiserror = "2"
url = "2"
zbus = { version = "6.1", default-features = false, features = ["default-rt", "proxy", "service", "unixexec", "ibus"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt"] }
