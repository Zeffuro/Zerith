name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install
        run: npm ci

      - name: Fixture policy guard
        run: npm run test:fixture-policy

      - name: Public README readiness
        run: npm run test:public-readiness

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright editor smoke
        run: npm run test:visual:ci

      - name: Build packages
        run: npm run build

      - name: Browser/Desktop export parity smoke - example game
        run: npm run export:parity-smoke -- --game=games/example-game --outDir=dist/example-game-parity --base=./

      - name: Browser/Desktop export parity smoke - classic VN starter
        run: npm run export:parity-smoke -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-parity --base=./

      - name: Export example game
        run: npm run build:game -- --game=games/example-game --outDir=dist/example-game-ci --base=./

      - name: Exported runtime smoke - example game
        run: npm run test:runtime-smoke -- --game=games/example-game --outDir=dist/example-game-ci --skipBuild --expect="Rain on the glass" --expect="No borrowed cast"

      - name: Export classic VN starter
        run: npm run build:game -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-ci --base=./

      - name: Exported runtime smoke - classic VN starter
        run: npm run test:runtime-smoke -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-ci --skipBuild
