name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            packages/editor/src-tauri -> target
            packages/player/desktop-shell -> target

      - name: Install
        run: npm ci

      - name: Build editor resources
        run: npm run build --workspace=zerith-editor

      - name: Build prebuilt game player
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/player/desktop-shell/target
        run: npm run build:player:desktop

      - name: Game player formatting
        run: cargo fmt --manifest-path packages/player/desktop-shell/Cargo.toml --all -- --check

      - name: Game player lint
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/player/desktop-shell/target
        run: cargo clippy --manifest-path packages/player/desktop-shell/Cargo.toml --locked --all-targets -- -D warnings

      - name: Game player regression tests
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/packages/player/desktop-shell/target
        run: cargo test --manifest-path packages/player/desktop-shell/Cargo.toml --locked

      - name: Rust formatting
        run: cargo fmt --manifest-path packages/editor/src-tauri/Cargo.toml --all -- --check

      - name: Rust lint
        run: cargo clippy --manifest-path packages/editor/src-tauri/Cargo.toml --locked --all-targets -- -D warnings

      - name: Native regression tests
        run: cargo test --manifest-path packages/editor/src-tauri/Cargo.toml --locked

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install
        run: npm ci

      - name: Fixture policy guard
        run: npm run test:fixture-policy

      - name: Public surface check
        run: npm run check:public

      - name: Package publication check
        run: node scripts/report-package-publication.mjs --json

      - name: Npm publication check
        run: node scripts/report-npm-publication.mjs --json

      - name: Publication check regression tests
        run: npm run test:publication

      - name: Npm package consumer smoke
        run: npm run test:npm-core

      - name: Npm player CLI smoke
        run: npm run test:npm-player

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Desktop package contract tests
        run: npm run test:desktop-package

      - name: Desktop player build contract tests
        run: node --test packages/player/scripts/build-desktop-runtime.test.mjs

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Playwright editor smoke
        id: browser-smoke
        run: npm run test:visual:ci

      - name: Browser failure diagnostics
        if: ${{ failure() && steps.browser-smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-failure-diagnostics
          path: test-results/playwright/
          retention-days: 7

      - name: Build packages
        run: npm run build

      - name: Browser/Desktop export parity smoke - example game
        run: npm run export:parity-smoke -- --game=games/example-game --outDir=dist/example-game-parity --base=./

      - name: Browser/Desktop export parity smoke - classic VN starter
        run: npm run export:parity-smoke -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-parity --base=./

      - name: Export example game
        run: npm run build:game -- --game=games/example-game --outDir=dist/example-game-ci --base=./

      - name: Exported runtime smoke - example game
        run: npm run test:runtime-smoke -- --game=games/example-game --outDir=dist/example-game-ci --skipBuild --expect="Rain on the glass" --expect="No borrowed cast"

      - name: Export classic VN starter
        run: npm run build:game -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-ci --base=./

      - name: Exported runtime smoke - classic VN starter
        run: npm run test:runtime-smoke -- --game=games/classic-vn-starter --outDir=dist/classic-vn-starter-ci --skipBuild
