name: Deploy Example Game

on:
  push:
    branches:
      - master
    paths:
      - games/example-game/**
      - packages/core/**
      - packages/player/**
      - package-lock.json
      - package.json
      - .github/workflows/deploy-example-game.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: npm
          node-version: 22

      - name: Install
        run: npm ci

      - name: Build example game
        run: node scripts/build-game.mjs --game=games/example-game --outDir=dist/example-game --base="/${{ github.event.repository.name }}/"
        working-directory: packages/player

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/example-game

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
