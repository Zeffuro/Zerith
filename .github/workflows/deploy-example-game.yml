name: Deploy Zerith Browser Sites

on:
  push:
    branches:
      - master
    paths:
      - games/example-game/**
      - packages/core/**
      - packages/editor/**
      - packages/player/**
      - package-lock.json
      - package.json
      - .github/workflows/deploy-example-game.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  cancel-in-progress: true
  group: pages

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          cache: npm
          node-version: 22

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Build core package
        run: npm run build --workspace=@zeffuro/zerith-core

      - name: Build browser editor
        env:
          ZERITH_EDITOR_BASE: /${{ github.event.repository.name }}/editor/
          ZERITH_EDITOR_OUT_DIR: ../../dist/pages/editor
        run: npm run build --workspace=zerith-editor

      - name: Build example game
        run: npm run build:game -- --game=games/example-game --outDir=dist/pages/example-game --base="/${{ github.event.repository.name }}/example-game/"

      - name: Exported runtime smoke - example game
        run: npm run test:runtime-smoke -- --game=games/example-game --outDir=dist/pages/example-game --base="/${{ github.event.repository.name }}/example-game/" --skipBuild --expect="Rain on the glass" --expect="No borrowed cast"

      - name: Write Pages index
        run: |
          cat > dist/pages/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8">
              <meta name="viewport" content="width=device-width, initial-scale=1">
              <title>Zerith</title>
            </head>
            <body>
              <main>
                <h1>Zerith</h1>
                <ul>
                  <li><a href="./editor/">Browser editor</a></li>
                  <li><a href="./example-game/">Example game</a></li>
                </ul>
              </main>
            </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
